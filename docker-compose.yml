services:
  db:
    image: postgres:17-alpine
    container_name: padel-db
    environment:
      POSTGRES_DB: padel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_pwd
    ports:
      - "5432:5432"
    volumes:
      - padel_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d padel"]
      interval: 5s
      retries: 5

volumes:
  padel_data: